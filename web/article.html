<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万星日报 · 每天一个 GitHub 万星项目</title>
<meta name="description" content="万星日报：每天只讲一个 GitHub 万星热门项目（运行时抓取 Trending 热度榜）。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a3d6e">
<meta property="og:site_name" content="万星日报">
<meta property="og:type" content="article">
<meta property="og:title" content="万星日报">
<meta property="og:description" content="每天只讲一个 GitHub 万星前沿项目。">
<meta property="og:image" content="https://kuangketongxue.github.io/daily10k/img/hero-sky.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://kuangketongxue.github.io/daily10k/article.html">
<link rel="preload" as="image" href="img/hero-sky.webp" type="image/webp" media="(min-width: 780px)">
<link rel="preload" as="image" href="img/hero-sky-sm.webp" type="image/webp" media="(max-width: 779px)">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<header class="article-band">
  <div class="band-bg" role="img" aria-label="晴朗蓝天下的大朵白云倒映在平静的水面上"></div>
  <div class="band-veil"></div>
  <div class="wrap masthead">
    <a class="logo" href="index.html">万星日报<span class="logo-en">DAILY 10K</span></a>
    <a class="masthead-link" href="index.html">今天的日报</a>
  </div>
</header>

<main class="wrap article-wrap" id="article">
  <div class="loading" id="loading" role="status">加载中<span class="dots"></span></div>
  <noscript><p class="empty">本站需要启用 JavaScript 才能加载日报正文。</p></noscript>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-row">
      <p>由 GitHub Trending 实时热度 + AI 深读自动生成 · <a href="index.html">返回首页</a></p>
      <p class="credit">背景图：Pexels（Pexels License，可免费商用）</p>
    </div>
  </div>
</footer>

<script>
const article = document.getElementById('article');
const rawDate = new URLSearchParams(location.search).get('d') || '';

if (/^\d{4}-\d{2}-\d{2}$/.test(rawDate)) load(rawDate);
else loadLatest();

// 没带 d 参数时回落到今日索引，而不是去请求 posts/null.json
function loadLatest() {
  fetch('data/index.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(idx => {
      const latest = idx.issues && idx.issues[0] && idx.issues[0].date;
      if (!latest) throw new Error('empty');
      history.replaceState(null, '', 'article.html?d=' + latest);
      load(latest);
    })
    .catch(fail);
}

function load(date) {
  fetch('data/posts/' + encodeURIComponent(date) + '.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(fail);
}

function fail() {
  document.title = '没有找到这一期的日报 · 万星日报';
  setMeta('robots', 'noindex');
  article.innerHTML = `
    <div class="empty">
      <p class="big" aria-hidden="true">☁</p>
      <p>没有找到这一期的日报。</p>
      <p class="empty-hint">本站每天只保留当天一篇，往期链接会失效。<a href="index.html">回首页看今天的</a></p>
    </div>`;
}

function setMeta(key, content, attr = 'name') {
  let el = document.head.querySelector(`meta[${attr}="${key}"]`);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(attr, key);
    document.head.appendChild(el);
  }
  el.setAttribute('content', content || '');
}

function setCanonical(href) {
  let el = document.head.querySelector('link[rel="canonical"]');
  if (!el) {
    el = document.createElement('link');
    el.rel = 'canonical';
    document.head.appendChild(el);
  }
  el.href = href;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtNum(n) {
  const v = Number(n);
  return Number.isFinite(v) ? v.toLocaleString('zh-CN') : esc(n);
}

function render(p) {
  const title = p.title || '万星日报';
  document.title = title + ' · 万星日报';
  setMeta('description', p.oneLiner);
  setMeta('og:title', title + ' · 万星日报', 'property');
  setMeta('og:description', p.oneLiner, 'property');
  setMeta('og:url', location.href, 'property');
  setCanonical(location.origin + location.pathname + (p.date ? '?d=' + encodeURIComponent(p.date) : ''));

  const m = p.meta || {};
  const stats = p.stats || {};
  let html = `<a class="back" href="index.html"><span aria-hidden="true">←</span> 回首页</a>
    <h1 class="a-title">${esc(title)}</h1>
    <div class="a-summary">
      <p class="a-oneliner"><strong>一句话：</strong>${esc(p.oneLiner)}</p>
      <div class="a-metas">
        ${p.date ? `<span>${esc(p.date)}</span>` : ''}
        <span>${esc(p.category || '')}</span>
        ${m.license ? `<span>${esc(m.license)}</span>` : ''}
        ${m.language ? `<span>${esc(m.language)}</span>` : ''}
        ${m.stars ? `<span>GitHub 星数 ${fmtNum(m.stars)}</span>` : ''}
        ${m.trending ? `<span class="hot">Trending ${esc(m.trending.window)} #${esc(m.trending.rank)} · ${esc(m.trending.unit)}+${fmtNum(m.trending.gained)}★</span>` : ''}
        ${m.lenses ? `<span>适合 ${esc(m.lenses.join(' / '))}</span>` : ''}
        ${m.lastCommit ? `<span>最近提交 ${esc(m.lastCommit)}</span>` : ''}
        ${m.openIssues != null ? `<span>未关闭 Issue/PR ${fmtNum(m.openIssues)}</span>` : ''}
        ${m.version ? `<span>${esc(m.version)}</span>` : ''}
        ${stats.minutes ? `<span>阅读约 ${esc(stats.minutes)} 分钟</span>` : ''}
      </div>
    </div>`;

  let body = '';
  for (const sec of p.sections || []) {
    // 稿件的章节标题自带「1 」「2 」这样的序号，抽出来单独排版，避免和装饰序号重复
    const raw = String(sec.heading ?? '');
    const mt = raw.match(/^\s*(\d{1,2})\s*[.、．]?\s+(.+)$/);
    const num = mt ? mt[1].padStart(2, '0') : '';
    const label = mt ? mt[2] : raw;
    body += `<section class="a-sec"><h2${num ? ` data-num="${num}"` : ''}>${esc(label)}</h2>`;
    for (const b of sec.blocks || []) {
      if (b.type === 'p') {
        body += `<p>${inline(b.text)}</p>`;
      } else if (b.type === 'sub') {
        body += `<h3>${esc(b.text)}</h3>`;
      } else if (b.type === 'kv') {
        body += `<p class="a-kv"><strong>${esc(b.k)}</strong>${inline(b.v)}</p>`;
      } else if (b.type === 'list') {
        body += '<ul>' + b.items.map(i => `<li>${inline(i)}</li>`).join('') + '</ul>';
      } else if (b.type === 'code') {
        body += `<pre class="a-code"><code>${esc(b.code)}</code></pre>`;
        if (b.caption) body += `<p class="a-caption">${esc(b.caption)}</p>`;
      } else if (b.type === 'quote') {
        body += `<blockquote>${inline(b.text)}</blockquote>`;
      }
    }
    body += '</section>';
  }
  html += `<div class="a-body">${body}</div>`;

  if (m.repo) {
    html += `
    <div class="a-repo">
      <p>想自己试试？项目地址：</p>
      <p><a class="repo-link" href="https://github.com/${esc(m.repo)}" target="_blank" rel="noopener">github.com/${esc(m.repo)}</a></p>
    </div>`;
  }

  if (stats.chars != null) {
    html += `
    <p class="a-stats">字数自检：正文汉字 ${fmtNum(stats.chars)} 字 · 命令块 ${fmtNum(stats.codeBlocks)} 个 · 阅读约 ${esc(stats.minutes)} 分钟 · 材料截至 ${esc(stats.asOf)}。</p>`;
  }

  document.getElementById('loading')?.remove();
  article.innerHTML = html;
}

// 先摘出行内代码和链接，再整体转义，避免 URL 吞掉后续中文/标点
function inline(s) {
  const slots = [];
  const stash = (html) => {
    slots.push(html);
    return '\u0000' + (slots.length - 1) + '\u0000';
  };
  let text = String(s ?? '');
  text = text.replace(/`([^`]+)`/g, (_, code) => stash(`<code class="ic">${esc(code)}</code>`));
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
    (_, label, url) => stash(`<a class="src-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`));
  text = text.replace(/https?:\/\/[^\s<>"'`*\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]+/g, (url) => {
    const clean = url.replace(/[.,;:!?]+$/, '');
    return stash(`<a class="src-link" href="${esc(clean)}" target="_blank" rel="noopener">${esc(clean)}</a>`) + url.slice(clean.length);
  });
  text = esc(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => slots[+i]);
}

// 顶部阅读进度条
(function () {
  const bar = document.getElementById('progress');
  const upd = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(window.scrollY / max, 1) : 0) + ')';
  };
  addEventListener('scroll', upd, { passive: true });
  addEventListener('resize', upd, { passive: true });
  upd();
})();

// 浏览器不支持 WebP 时回落到 JPG 背景
(function () {
  const probe = new Image();
  probe.onerror = function () { document.documentElement.classList.add('no-webp'); };
  probe.src = 'data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA';
})();
</script>
</body>
</html>
