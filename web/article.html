<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万星日报 · 每天一个 GitHub 万星项目</title>
<meta name="description" content="万星日报：每天只讲一个 GitHub 万星热门项目（运行时抓取 Trending 热度榜）。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a3d6e">
<meta property="og:site_name" content="万星日报">
<meta property="og:type" content="article">
<meta property="og:title" content="万星日报">
<meta property="og:description" content="每天只讲一个 GitHub 万星前沿项目。">
<meta property="og:image" content="https://kuangketongxue.github.io/daily10k/img/hero-sky.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="800">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://kuangketongxue.github.io/daily10k/img/hero-sky.jpg">
<link rel="canonical" href="https://kuangketongxue.github.io/daily10k/article.html">
<link rel="preload" as="image" href="img/hero-sky.webp" type="image/webp" media="(min-width: 780px)">
<link rel="preload" as="image" href="img/hero-sky-sm.webp" type="image/webp" media="(max-width: 779px)">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<header class="article-band">
  <div class="band-bg" role="img" aria-label="晴朗蓝天下的大朵白云倒映在平静的水面上"></div>
  <div class="band-veil"></div>
  <div class="wrap masthead">
    <a class="logo" href="index.html">万星日报<span class="logo-en">DAILY 10K</span></a>
    <a class="masthead-link" href="index.html">今天的日报</a>
  </div>
</header>

<main class="wrap article-wrap" id="article">
  <div class="loading" id="loading" role="status">加载中<span class="dots"></span></div>
  <noscript><style>#loading{display:none}</style><h1 class="a-title">万星日报</h1><p class="empty">本站需要启用 JavaScript 才能加载日报正文。</p></noscript>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="foot-row">
      <p>由 GitHub Trending 实时热度 + AI 深读自动生成 · <a href="index.html">返回首页</a></p>
      <p class="credit">背景图：Pexels（Pexels License，可免费商用）</p>
    </div>
  </div>
</footer>

<script src="favorites.js"></script>
<script src="register-sw.js"></script>
<script>
const article = document.getElementById('article');
const rawDate = new URLSearchParams(location.search).get('d') || '';

// 全文可能有两处来源：posts/ 是当天池（会被每日清理），archive/ 是被收藏期次的永久归档。
// 必须依次尝试，避免往期链接 404（往期全文现在永久保留，这里只是兜底）。
const SOURCES = ['data/posts/', 'data/archive/'];

async function load(date) {
  for (const dir of SOURCES) {
    try {
      const res = await fetch(dir + encodeURIComponent(date) + '.json', { cache: 'no-cache' });
      if (!res.ok) continue;
      render(await res.json());
      return;
    } catch (e) { /* 解析失败或换下一个来源继续找 */ }
  }
  fail(date);
}

function bjToday() {
  return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
}

// 没带 d 参数时回落到今日索引，而不是去请求 posts/null.json
function loadLatest() {
  fetch('data/index.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(idx => {
      const latest = idx.issues && idx.issues[0] && idx.issues[0].date;
      if (!latest) throw new Error('empty');
      history.replaceState(null, '', 'article.html?d=' + latest);
      load(latest);
    })
    .catch(() => fail());
}

function fail(date) {
  document.title = '没有找到这一期的日报 · 万星日报';
  setMeta('robots', 'noindex');
  const hint = date && date !== bjToday()
    ? '往期全文都保留着，可能是这一期还没生成过。'
    : '今天的日报可能还在生成，5:30 前会更新。';
  article.innerHTML = `
    <div class="empty">
      <p class="big" aria-hidden="true">☁</p>
      <p>没有找到这一期的日报。</p>
      <p class="empty-hint">${hint}<a href="index.html">回首页看今天的</a></p>
    </div>`;
}

function setMeta(key, content, attr = 'name') {
  let el = document.head.querySelector(`meta[${attr}="${key}"]`);
  if (!el) {
    el = document.createElement('meta');
    el.setAttribute(attr, key);
    document.head.appendChild(el);
  }
  el.setAttribute('content', content || '');
}

function setCanonical(href) {
  let el = document.head.querySelector('link[rel="canonical"]');
  if (!el) {
    el = document.createElement('link');
    el.rel = 'canonical';
    document.head.appendChild(el);
  }
  el.href = href;
}

function render(p) {
  const title = p.title || '万星日报';
  document.title = title + ' · 万星日报';
  setMeta('description', p.oneLiner);
  setMeta('og:title', title + ' · 万星日报', 'property');
  setMeta('og:description', p.oneLiner, 'property');
  setMeta('og:url', location.href, 'property');
  setCanonical(location.origin + location.pathname + (p.date ? '?d=' + encodeURIComponent(p.date) : ''));

  // 正文排版统一由 favorites.js 的 renderPostHtml 产出，这里只补文章页独有的外壳，
  // 避免两处各写一份 esc/inline 后逐渐漂移
  const html = `<a class="back" href="index.html"><span aria-hidden="true">←</span> 回首页</a>`
    + renderPostHtml(p, { afterTitle: '<div class="a-fav-slot" id="a-fav"></div>' });

  document.getElementById('loading')?.remove();
  article.innerHTML = html;
  if (p.date) mountFavButton(document.getElementById('a-fav'), p.date, {
    label: '收藏这一期',
    onLabel: '已收藏 · 点击取消',
  });
}

// 入口放在所有定义之后：load() 在第一个 await 之前就会读 SOURCES，
// 之前的写法把调用放在 const SOURCES 之前，带 ?d= 直达会直接抛 TDZ 错误、整页空白
if (/^\d{4}-\d{2}-\d{2}$/.test(rawDate)) load(rawDate);
else loadLatest();

// 顶部阅读进度条
(function () {
  const bar = document.getElementById('progress');
  const upd = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.transform = 'scaleX(' + (max > 0 ? Math.min(window.scrollY / max, 1) : 0) + ')';
  };
  addEventListener('scroll', upd, { passive: true });
  addEventListener('resize', upd, { passive: true });
  upd();
})();

// 浏览器不支持 WebP 时回落到 JPG 背景
(function () {
  const probe = new Image();
  probe.onerror = function () { document.documentElement.classList.add('no-webp'); };
  probe.src = 'data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA';
})();
</script>
</body>
</html>
