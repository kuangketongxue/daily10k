<body>
<section class="hero">
  <div class="hero-bg" role="img" aria-label="晴朗蓝天下的大朵白云倒映在平静的水面上"></div>
  <div class="hero-veil"></div>
  <div class="wrap hero-inner">
    <p class="hero-kicker">Daily 10K · 每日一项目</p>
    <h1 class="hero-title">万星日报<span class="en">One Repo · Read Deep · Every Day</span></h1>
    <p class="hero-sub">每天只讲一个 GitHub <b>万星热门项目</b>。<br class="br-wide">它解决什么问题，能用来干嘛，怎么上手。</p>
    <div class="hero-chips">
      <span class="hero-chip">高考 / 考研</span>

      <a class="hero-fav-link" href="favorites.html">☆ 我的收藏夹</a>

<main id="today-sec" class="wrap">
  <div class="loading" id="loading" role="status">加载今日日报<span class="dots"></span></div>
  <noscript><style>#loading{display:none}</style><p class="empty">本站需要启用 JavaScript 才能加载今日日报。</p></noscript>
  <div class="stale" id="stale" hidden></div>
  <article class="today" id="today" hidden>
    <div class="today-meta">
      <span class="issue-date" id="t-date"></span>
      <span class="issue-sep" aria-hidden="true"></span>
      <span class="today-stars" id="t-stars"></span>
    </div>
    <h2 class="today-title" id="t-title"></h2>
    <p class="today-oneliner" id="t-oneliner"></p>
    <div class="today-tags" id="t-category"></div>
    <div class="today-actions">
      <a class="read-btn" id="t-link" href="article.html">阅读全文<span class="go" aria-hidden="true">→</span></a>
      <span class="today-fav-slot" id="t-fav"></span>
    </div>
  </article>
  <div class="empty" id="empty" hidden>
    <p class="big" aria-hidden="true">☁</p>
    <p>今天的日报还没生成，5:30 前会更新，稍后再来看看。</p>
    <p class="empty-hint">热度榜每天现场抓取，只保留当天这一篇。</p>
  </div>
</main>

  <div class="wrap">
    <div class="foot-row">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "万星日报",
  "alternateName": "Daily 10K",
  "url": "https://kuangketongxue.github.io/daily10k/",
  "description": "每天只讲一个 GitHub 万星热门项目：它解决什么问题、能用来干嘛、怎么上手。",
  "inLanguage": "zh-CN"
}
</script>
<script src="favorites.js"></script>
<script src="register-sw.js"></script>
<script>
fetch('data/index.json', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(idx => {
    const it = idx.issues && idx.issues[0];
    if (!it) { show('empty'); return; }
    const stars = Number(it.stars);
    document.getElementById('t-date').textContent = it.date;
    const starsEl = document.getElementById('t-stars');
    if (Number.isFinite(stars) && stars > 0) {
      starsEl.textContent = '★ ' + stars.toLocaleString('zh-CN');
    } else {
      starsEl.hidden = true;
    }
    document.getElementById('t-title').textContent = it.title;
    document.getElementById('t-oneliner').textContent = it.oneLiner;
    // 分类用「·」「/」「,」分隔，逐项渲染成标签
    const catEl = document.getElementById('t-category');
    catEl.textContent = '';
    String(it.category || '')
      .split(/[·\/,，]/)
      .map(s => s.trim())
      .filter(Boolean)
      .forEach(t => {
        const s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        catEl.appendChild(s);
      });
    document.getElementById('t-link').href = 'article.html?d=' + encodeURIComponent(it.date);
    mountFavButton(document.getElementById('t-fav'), it.date);
    // 生成失败或还没跑完时，首页不能把旧文章冒充成今天的
    const bjToday = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
    if (it.date !== bjToday) {
      const stale = document.getElementById('stale');
      stale.textContent = '今天（' + bjToday + '）的日报还在生成，下面这期是 ' + it.date + ' 的。';
      stale.hidden = false;
    }
    show('today');
  })
  .catch(() => {
    document.getElementById('loading').textContent = '今日日报加载失败，请检查网络后刷新重试。';
  });

function show(id) {
  document.getElementById('loading').hidden = true;
  document.getElementById(id).hidden = false;
}

// 浏览器不支持 WebP 时回落到 JPG 背景
(function () {
  const probe = new Image();
  probe.onerror = function () { document.documentElement.classList.add('no-webp'); };
  probe.src = 'data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA';
})();
</script>
</body>
</html>
