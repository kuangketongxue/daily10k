name: daily-report

on:
  schedule:
    # UTC 21:30 = 北京时间每天 5:30
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只验证选品与写稿，不写入数据、不提交
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 生成今日日报
        env:
          # 不带 token 时 GitHub API 只有 60 次/小时且按共享 IP 计，搜索接口极易 403
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          for i in 1 2 3; do
            if node scripts/generate.mjs; then exit 0; fi
            echo "第 $i 次生成失败，30 秒后重试"
            sleep 30
          done
          exit 1

      - name: 提交数据变更
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data scripts/history.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "daily report $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "推送失败，第 $i 次重试"
            sleep 5
          done
          exit 1
