name: daily-report

on:
  schedule:
    # GitHub 的 schedule 不保证准点：实测（2026-10-30~11-02）21:30 UTC 的批次
    # 实际 00:54~01:41 UTC 才创建，排队延迟 3~4 小时，所以单靠「北京 5:30」那一批
    # 必然迟到，网站 5:30 打开时还是前一天的文章。
    #
    # 对策：在「北京 00:00~07:30」这个窗口里多排几批（UTC 16:00~23:30 都落在同一个
    # 北京日期），哪批先跑起来就先出稿，其余批次命中「当天已生成」闸门后几秒退出。
    # 延迟 5.5 小时以内，第一批（UTC 16:00）就能在北京 5:30 前把稿子发出去。
    - cron: "0 16 * * *"   # 北京 00:00（主力，抵御 3~4 小时排队延迟）
    - cron: "30 17 * * *"  # 北京 01:30
    - cron: "0 19 * * *"   # 北京 03:00
    - cron: "30 21 * * *"  # 北京 05:30
    - cron: "30 22 * * *"  # 北京 06:30
    - cron: "30 23 * * *"  # 北京 07:30 兜底
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只验证选品与写稿，不写入数据、不提交
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 生成今日日报
        env:
          # 不带 token 时 GitHub API 只有 60 次/小时且按共享 IP 计，搜索接口极易 403
          GITHUB_TOKEN: ${{ github.token }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          # 圈内风向信号：搜「最近被公开推荐的开源项目」。没有这个 secret 时选品照常跑，只是少一路加权
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          for i in 1 2 3; do
            if node scripts/generate.mjs; then exit 0; fi
            echo "第 $i 次生成失败，30 秒后重试"
            sleep 30
          done
          exit 1

      - name: 提交数据变更
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data scripts/history.json
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git commit -m "daily report $(TZ=Asia/Shanghai date +%F)"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "推送失败，第 $i 次重试"
            sleep 5
          done
          exit 1
