name: deploy-pages

on:
  push:
    branches: [main]
    paths: [web/**]
  # daily-report 用默认 GITHUB_TOKEN 提交，这类推送不会触发上面的 push 事件
  # （GitHub 防递归机制），所以要在它跑完后显式发布一次
  workflow_run:
    workflows: [daily-report]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: 上传静态站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
